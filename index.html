<!doctype html>
<html lang="en" data-theme="ivory">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://s.ytimg.com" crossorigin />
    <meta name="theme-color" content="#f6efe3" />
    <title>Hey Carmen</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="A small gift, built in code." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:title" content="Hey Carmen" />
    <meta property="og:description" content="A small gift, built in code." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="dust" aria-hidden="true"></div>
    <div class="app" id="app">
      <header class="topbar">
        <a class="crest" href="#bloom" aria-label="Back to the start"><span class="script">C</span></a>
        <span class="brand">Made for Carmen</span>
        <div class="tools">
          <div id="theme-host"></div>
        </div>
        <span class="route-line" aria-hidden="true"></span>
      </header>

      <div class="views" id="views">
        <div class="views-inner" id="views-inner">
          <section class="view" id="v-bloom" hidden></section>
          <section class="view" id="v-bouquet" hidden></section>
          <section class="view" id="v-golden-hour" hidden></section>
          <section class="view" id="v-after-dark" hidden></section>
        </div>
      </div>

      <nav class="dock" aria-label="Pages">
        <a href="#bloom" data-p="bloom"><i data-lucide="flower-2"></i><span class="num">I</span><span class="lbl">Bloom</span></a>
        <a href="#bouquet" data-p="bouquet"><i data-lucide="flower"></i><span class="num">II</span><span class="lbl">Bouquet</span></a>
        <a href="#golden-hour" data-p="golden-hour"><i data-lucide="sunset"></i><span class="num">III</span><span class="lbl">Golden</span></a>
        <a href="#after-dark" data-p="after-dark"><i data-lucide="moon"></i><span class="num">IV</span><span class="lbl">Dark</span></a>
      </nav>
    </div>

    <noscript><p style="padding:24px;font:16px/1.6 Georgia,serif;color:#f6e7c1;background:#07090a">Hey Carmen. This page is made of code and needs JavaScript to bloom.</p></noscript>
    <!-- The opening song's player. It is never shown, but it has to be on the page so the song can play. -->
    <div class="sound intro-sound" data-song="intro" aria-hidden="true"><div class="sound-player"><div class="sound-target"></div></div></div>
    <div id="intro" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
